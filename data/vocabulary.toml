# -- capabilities, parents before children ----------------------------------------------------
# What a tool can do (BFO Functions, data-model.md Sec 3 and J37), for a recipe that does not care
# which tool: { capability = "Broiler heat" } in a step's equipment is met by any tool whose type `can`
# give it or one of its subtypes, and its sentence names them ("on the grill or oven"). Capability and
# Heating have been seeded since scripts/05. Chosen by Claude from the alternatives real recipes gave
# (J24 item 3: "broil or grill", "oven or toaster oven"), to be reviewed.

[[capability]]
name = "Capability"

[[capability]]
name = "Heating"
parent = "Capability"

[[capability]]
name = "Oven heat"              # dry heat all around, in a closed box
parent = "Heating"

[[capability]]
name = "Broiler heat"           # strong heat from one side, close by
