# The curated vocabulary: foods, cooking methods and the nutrients kept through cooking.
# Loaded by tools/import_vocabulary.py (mealplanner/vocabulary_import.py).
#
# Every food with an `fdc` id takes its nutrients from USDA FoodData Central, SR Legacy
# (April 2018): U.S. Department of Agriculture, Agricultural Research Service, FoodData Central,
# fdc.nal.usda.gov. Public domain (CC0 1.0). tools/fdc_extract.py pins the foods named here into
# data/fdc/sr_legacy.json; re-run it after adding a food.
#
#   fdc      the FDC food. The match was chosen by Claude and is listed here to be reviewed.
#   proxy    true when FDC has no entry for this food and `fdc` is the closest one it has. Its
#            profiles are loaded as `placeholder`, so they never decide a hard nutrition target.
#   each     the FDC portion that gives the mass of one ("1 large egg = 50 g"): MassPerUnit
#   volume   the FDC portion that gives a density ("1 cup, sliced = 115 g"): Density
#   parent   default "Food", the root every food sits under

[source]
subset = "data/fdc/sr_legacy.json"

[retention]
# The owner's decision (2026-09-26): energy, protein, fat, carbohydrate, fiber and sugars are
# kept through cooking, as USDA's recipe calculations treat them; its retention factors adjust
# vitamins and minerals. Fat gained in frying or poured off is not modeled (J18). FDC nutrient
# ids: Energy (kcal), Protein, Total lipid (fat), Carbohydrate by difference, Fiber total
# dietary, Sugars total.
kept_in_cooking = [1008, 1003, 1004, 1005, 1079, 2000]

# -- methods, parents before children --------------------------------------------------------

