# The curated vocabulary: foods, cooking methods, equipment and what it can do, and the nutrients kept
# through cooking.
# Loaded by tools/import_vocabulary.py (mealplanner/vocabulary_import.py).
#
# Figures come from USDA FoodData Central: U.S. Department of Agriculture, Agricultural Research
# Service, FoodData Central, fdc.nal.usda.gov. Public domain (CC0 1.0). tools/fdc_extract.py pins
# the foods named here into data/fdc/; re-run it after adding one.
#
# Every figure is loaded with its provenance and its source, so it can be checked and replaced:
#   sourced     a published figure for this very food
#   estimated   anything nearer or rougher: a similar food, an average of brand labels, a web figure
#   calculated  worked out from parts
# The owner decided (2026-09-27) that estimates are good enough to plan with (J21).
#
# A food:
#   fdc      its FDC food: `sourced`, or `estimated` with `proxy = true` (the nearest FDC has).
#            The match was chosen by Claude and is listed here to be reviewed.
#   sources  more sources, in order; each nutrient comes from the first that reports it:
#            { fdc = id } or { mean = [ids] } (an id listed twice counts twice: a blend's parts),
#            with status, `only = [FDC nutrient ids]`, note
#   each     the weight of one item: a portion label of its first source, or a table
#   volume   a density: the same, or { portions = [[fdc, label], ...] } averaged, or
#            { grams = x, per = "tsp", source = "..." } for a weight from elsewhere
#   foodkeeper  its USDA FoodKeeper product, for how long it keeps (J31): `sourced`, or
#            { id = n, proxy = true }, `estimated`, a near kind of food. Chosen by Claude, to be reviewed.
#   parent   default "Food", the root every food sits under; a food USDA's retention factors apply
#            to sits under its retention class
#   [food.retention]  on a retention class: the USDA row for each heat method (J30)

[source]
subsets = ["data/fdc/sr_legacy.json", "data/fdc/foundation.json", "data/fdc/fndds.json", "data/fdc/branded.json"]

[shelf_life]
# USDA FSIS FoodKeeper data (fsis.usda.gov/shared/data/EN/foodkeeper.json, CC0 1.0): how long a food
# keeps in the pantry, the refrigerator and the freezer, before and after opening. tools/
# foodkeeper_extract.py pins the products the foods name into `table`; re-run it after changing
# one. Each figure is the least of FoodKeeper's range, as the owner chose for leftovers (J31).
table = "data/foodkeeper/foodkeeper.json"

[retention]
# The owner's decision (2026-09-26): energy, protein, fat, carbohydrate, fiber and sugars are
# kept through cooking, as USDA's recipe calculations treat them; its retention factors adjust
# vitamins and minerals. Fat gained in frying or poured off is not modeled (J18). FDC nutrient
# ids: Energy (kcal), Protein, Total lipid (fat), Carbohydrate by difference, Fiber total
# dietary, Sugars total; then, by the owner's decision of 2026-10-24 ("I don't think there is
# significant degradation"), every fat FDC reports apart: the totals saturated (1258),
# monounsaturated (1292), polyunsaturated (1293) and trans (1257, 1329, 1331), and each fatty
# acid (SFA, MUFA, PUFA, TFA). Cholesterol (1253) is not a fat and is not among them.
kept_in_cooking = [1008, 1003, 1004, 1005, 1079, 2000,
  1257, 1258, 1259, 1260, 1261, 1262, 1263, 1264, 1265, 1266, 1267, 1268, 1269, 1270,
  1271, 1272, 1273, 1274, 1275, 1276, 1277, 1278, 1279, 1280, 1292, 1293, 1299, 1300,
  1301, 1303, 1304, 1305, 1306, 1307, 1310, 1311, 1312, 1313, 1314, 1315, 1316, 1317,
  1321, 1323, 1325, 1329, 1331, 1332, 1333, 1404, 1405, 1406, 1408, 1409, 1410, 1411,
  1412,
]

# USDA Table of Nutrient Retention Factors, Release 6 (2007), ars.usda.gov: public domain. tools/
# retention_extract.py pins the rows the retention classes below name into `table`; re-run it after
# changing one. A retention class is a food Type its members sit under; it names, for each heat
# method, the USDA row for its food group cooked that way, and a member's every heat-cooked step
# takes that row's factors (J30). The rows were chosen by Claude (2026-10-23), for the owner to
# review: where USDA gives a row with drippings and one without, with drippings, since the
# drippings are counted as eaten as the recipe's fat is (J20); a canned, baked or otherwise
# cooked-already food takes the "reheated" row.
table = "data/retention/usda_r6.json"
# The nutrients the dietary profiles target that USDA gives factors for. Vitamins D, E and K and
# the fatty acids have none: they are counted whole, and say so.
nutrients = [1087, 1089, 1090, 1091, 1092, 1093, 1095, 1106, 1162, 1165, 1166, 1167, 1175, 1178, 1180, 1190]
# USDA has no factor for these as FDC states them; the nearest it has stands in. Vitamin A (RAE)
# takes Vitamin A (RE)'s, Folate (DFE) takes total folate's.
stand_ins = { 1106 = 392, 1190 = 417 }
# Methods that apply no heat: every nutrient above is kept whole (a factor of 1 on "Food").
no_heat = ["No-Heat Method", "Soaking", "Marinating", "Mixing",
           "Mechanical Method", "Chopping", "Dicing", "Mincing", "Slicing", "Grating", "Peeling", "Mashing"]

