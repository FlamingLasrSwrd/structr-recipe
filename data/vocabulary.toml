# The curated vocabulary: foods, cooking methods, equipment and the nutrients kept through cooking.
# Loaded by tools/import_vocabulary.py (mealplanner/vocabulary_import.py).
#
# Figures come from USDA FoodData Central: U.S. Department of Agriculture, Agricultural Research
# Service, FoodData Central, fdc.nal.usda.gov. Public domain (CC0 1.0). tools/fdc_extract.py pins
# the foods named here into data/fdc/; re-run it after adding one.
#
# Every figure is loaded with its provenance and its source, so it can be checked and replaced:
#   sourced     a published figure for this very food
#   estimated   anything nearer or rougher: a similar food, an average of brand labels, a web figure
#   calculated  worked out from parts
# The owner decided (2026-09-27) that estimates are good enough to plan with (J21).
#
# A food:
#   fdc      its FDC food: `sourced`, or `estimated` with `proxy = true` (the nearest FDC has).
#            The match was chosen by Claude and is listed here to be reviewed.
#   sources  more sources, in order; each nutrient comes from the first that reports it:
#            { fdc = id } or { mean = [ids] } (an id listed twice counts twice: a blend's parts),
#            with status, `only = [FDC nutrient ids]`, note
#   each     the weight of one item: a portion label of its first source, or a table
#   volume   a density: the same, or { portions = [[fdc, label], ...] } averaged, or
#            { grams = x, per = "tsp", source = "..." } for a weight from elsewhere
#   parent   default "Food", the root every food sits under

[source]
subsets = ["data/fdc/sr_legacy.json", "data/fdc/foundation.json", "data/fdc/fndds.json", "data/fdc/branded.json"]

[retention]
# The owner's decision (2026-09-26): energy, protein, fat, carbohydrate, fiber and sugars are
# kept through cooking, as USDA's recipe calculations treat them; its retention factors adjust
# vitamins and minerals. Fat gained in frying or poured off is not modeled (J18). FDC nutrient
# ids: Energy (kcal), Protein, Total lipid (fat), Carbohydrate by difference, Fiber total
# dietary, Sugars total.
kept_in_cooking = [1008, 1003, 1004, 1005, 1079, 2000]

