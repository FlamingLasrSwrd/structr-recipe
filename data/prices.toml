# Interim food prices: public figures for the vocabulary's foods, until the owner's own prices and
# purchases replace them (docs/prices.md, mealplanner/prices.py, data-model.md Sec 18 J27).
#
# Two public sources, pinned in data/prices/ by tools/price_extract.py (both are U.S. government works):
#   bls    BLS Average Price Data (CPI), monthly, as bought: the latest month for the U.S. city average and,
#          where BLS publishes it, the West region. About 45 foods. https://www.bls.gov/cpi/factsheets/average-prices.htm
#   ppnap  USDA ERS Purchase to Plate National Average Prices, 2017-18 (Circana scanner data), per 100 g of the
#          food as eaten (edible part), keyed by FNDDS food code. Brought to today's prices by the CPI for food
#          at home (U.S. city average, CUUR0000SAF11): latest month over the 2017-18 mean.
#          https://www.ers.usda.gov/data-products/purchase-to-plate
#
# Each [[price]] names one source for one food. Its figure is `sourced` if the source prices this very
# food (a BLS price, converted to dollars per 100 g), `calculated` if it is a Purchase to Plate price
# brought forward by the CPI, and `estimated` if `proxy = true` (a similar food) or `cooked = true` (a
# Purchase to Plate price for the cooked food, used for the raw one: it overstates a raw gram by about
# the weight lost in cooking). A food may name both: the BLS price, where there is one, wins (J27).
#
# Not priced (no public figure found): spices and dried herbs, salt, baking powder and soda, yeast,
# cornstarch, vanilla, panko, rolled oats, tomato paste, canned coconut milk and green chiles, fresh
# ginger, semisweet chocolate, refrigerated biscuit dough, and the meal kits' own items (stock
# concentrates, spice blends, sauces and pastes, compote, truffle zest). A recipe's cost names them.

[bls]
# The BLS items used, as BLS names them, and the quantity each price is for.
