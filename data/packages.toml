# What the vocabulary's foods are sold in: common U.S. supermarket package sizes (docs/packages.md,
# mealplanner/packages.py, data-model.md J39). Loaded by tools/import_packages.py as the level
# "US supermarket" in the Package Reference hierarchy; the owner's own sizes are a level below it,
# from private/packages.toml (tools/instantiate_profile.py packages).
#
# Each food's `sizes` are an estimate: a size commonly seen on U.S. supermarket shelves, written down
# by Claude from general knowledge (2026-11-22), not checked against a store. A food with a
# [package.fdc] rule takes its sizes instead from FoodData Central's Branded Foods (public domain):
# the sizes its matching products most often come in, counted by tools/package_extract.py and pinned
# in data/packages/fdc.json (mealplanner/fdc_packages.py says how). Its estimate stands only where the
# count is too small to (and its estimated label is kept for a counted size within 2% of it). Brands
# and stores differ; the owner's own file replaces a food's sizes wherever they differ.
#
# A rule is three regular expressions, case ignored, written as TOML literal strings ('...', no
# escaping): `category` on the record's branded_food_category, `match` on its description, and
# `exclude` on its description (flavours, mixes, prepared dishes, snack packs: what is not this food).
# Change a rule, then run tools/package_extract.py again; the loader refuses a pin counted with a
# different rule. Foods sold by count (eggs, tortillas), loose, or by the bunch have no rule.
#
# A [[package]] names a food and the sizes it is sold in, each [amount, unit] or [amount, unit, label]:
#   - a unit the unit table knows (g, oz, lb, fl_oz, l, cup, each, ...). A volume needs the food's
#     density, a count its weight per item (both from data/vocabulary.toml); a mass always converts,
#     so net weights are given as printed where there is one;
#   - up to four sizes; the shopping list buys the mix that leaves least over, then the fewest packages.
#
# Left out on purpose:
#   - what is bought loose or by weight at a counter: most fresh produce (onions, apples, peppers,
#     tomatoes, ginger), meat and fish cut to order (chicken breasts, steaks, salmon, drumsticks).
#     The list buys what is needed, in whole items where the recipes count them;
#   - what is bought in one form and used in another, stage 3 of docs/todo.md's "What ingredients are
#     sold in": juice squeezed from a lemon, whites separated from eggs, a whole pineapple cut up, the
#     drained weight of a can whose recipe weighs it drained (water chestnuts), a rotisserie chicken;
#   - what a recipe makes (fillings, batters, sauces), and tap water.

# -- dairy and eggs --------------------------------------------------------------------------------
[[package]]
food = "Egg"
sizes = [[12, "each", "dozen"], [18, "each", "18 count"]]
[[package]]
food = "Whole milk"
sizes = [[64, "fl_oz", "half gallon"], [128, "fl_oz", "gallon"]]
[package.fdc]
category = '^Milk$'
match = '\bWHOLE\b.*\bMILK\b|\bMILK\b.*\bWHOLE\b|VITAMIN D MILK'
exclude = 'CHOCOLATE|STRAWBERRY|VANILLA|COFFEE|BANANA|EGGNOG|CARAMEL|COOKIES|HONEY|MAPLE|CINNAMON|FLAVOR|LACTOSE|BUTTERMILK|EVAPORATED|CONDENSED|POWDER|\bDRY\b|GOAT|CHOC|KEFIR'
[[package]]
food = "Fat-free milk"
sizes = [[64, "fl_oz", "half gallon"], [128, "fl_oz", "gallon"]]
[package.fdc]
category = '^Milk$'
match = '\b(FAT[ -]FREE|SKIM|NONFAT)\b'
exclude = 'CHOCOLATE|STRAWBERRY|VANILLA|COFFEE|BANANA|EGGNOG|CARAMEL|COOKIES|HONEY|MAPLE|CINNAMON|FLAVOR|LACTOSE|BUTTERMILK|EVAPORATED|CONDENSED|POWDER|\bDRY\b|GOAT|CHOC|KEFIR|PROTEIN|ULTRA'
[[package]]
food = "Buttermilk"
sizes = [[32, "fl_oz", "quart"]]
[package.fdc]
category = 'Milk|Cream'
match = 'BUTTERMILK'
exclude = 'PANCAKE|BISCUIT|RANCH|DRESSING|POWDER|MIX|BREAD|CHICKEN|\bDRY\b'
[[package]]
food = "Heavy cream"
sizes = [[8, "fl_oz", "half pint"], [16, "fl_oz", "pint"]]
[package.fdc]
category = '^Cream$'
match = 'HEAVY (WHIPPING )?CREAM|WHIPPING CREAM'
exclude = 'SOUR|\bICE\b|AEROSOL|WHIPPED|TOPPING|CHEESE|LIQUEUR|COFFEE|LIGHT|HALF'
[[package]]
food = "Evaporated milk (fat-free)"
sizes = [[12, "fl_oz", "can (12 fl oz)"]]
[package.fdc]
category = 'Milk|Cream|Baking'
match = 'EVAPORATED'
exclude = 'WHOLE|LOW ?FAT|\b2%|CONDENSED|COCONUT|GOAT|ALMOND|OAT|FILLED|^((?!FAT FREE|FAT-FREE|SKIM|NONFAT).)*$'
