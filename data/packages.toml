[package.fdc]
category = 'Other Meats|Tofu|Soy|Vegetarian|Meat Substitute|Protein'
match = '\b(EXTRA[ -])?FIRM TOFU\b|\bTOFU,? (EXTRA[ -])?FIRM\b|\bTOFU\b.*\b(EXTRA[ -])?FIRM\b'
