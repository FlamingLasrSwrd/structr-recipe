  { nutrient = 1005, min = 130, unit = "g", status = "sourced", source = "Dietary Guidelines for Americans 2020-2025 Table A1-2: carbohydrate RDA" },
  { nutrient = 1005, basis = "share of energy", min = 45, max = 65, status = "sourced", source = "Dietary Guidelines for Americans 2020-2025 Table A1-2: carbohydrate AMDR" },
  { nutrient = 1079, basis = "per 1000 kcal", min = 14, unit = "g", status = "sourced", source = "Dietary Guidelines for Americans 2020-2025 Table A1-2: fiber 14 g per 1,000 kcal" },
  { nutrient = 1235, basis = "share of energy", max = 10, status = "sourced", source = "Dietary Guidelines for Americans 2020-2025 Table A1-2: added sugars under 10% of calories (DGA)" },
  { nutrient = 1004, basis = "share of energy", min = 20, max = 35, status = "sourced", source = "Dietary Guidelines for Americans 2020-2025 Table A1-2: total fat AMDR (adults 19+)" },
  { nutrient = 1258, basis = "share of energy", max = 10, status = "sourced", source = "Dietary Guidelines for Americans 2020-2025 Table A1-2: saturated fat under 10% of calories (DGA)" },
]

