# Dietary reference profiles: daily nutrition targets for kinds of people, instantiated into the
# owner's own targets by tools/instantiate_profile.py (mealplanner/profiles.py, docs/profiles.md).
#
# A profile is a Type in the "Dietary Reference Profile" hierarchy; each intake is a DefaultSpecification
# of kind "Recommended Daily Intake" keyed by its nutrient (FDC nutrient id). A child inherits its
# parent's intakes and overrides any it restates. basis: an amount (default), "share of energy" (a
# percent of the day's calories, converted to grams at 4 kcal/g for protein, carbohydrate and sugars,
# 9 for fats) or "per 1000 kcal" (fiber), both worked out from the profile's energy when instantiated.
#
# Sources: Dietary Guidelines for Americans 2020-2025 (U.S. Department of Agriculture and U.S. Department of Health and Human Services),
# Appendix 1 Table A1-2 (from the Institute of Medicine / National Academies Dietary Reference Intakes)
# and Appendix 2 Table A2-2 (Estimated Energy Requirements); weight loss from the 2013 AHA/ACC/TOS
# obesity guideline. RDA and AI are floors (minimums); CDRR, the DGA limits and the AMDR bounds are
# ceilings or ranges. These are population guidelines, not personal advice. Upper limits are not listed.

[[profile]]
name = "Adult"
intakes = [
  { nutrient = 1093, max = 2300, unit = "mg", status = "sourced", source = "Dietary Guidelines for Americans 2020-2025 Table A1-2: sodium CDRR (all adults)" },
