# Pantry profiles: the staples typically on hand in five kinds of kitchen, instantiated into the owner's
# own stock by tools/instantiate_profile.py (mealplanner/profiles.py, docs/profiles.md).
#
# A profile is a Type in the "Pantry Profile" hierarchy; each item is a DefaultSpecification of kind
# "Pantry Stock" keyed by a Food Type (data/vocabulary.toml), its value an amount in any unit the food
# converts to grams (a mass; a volume if the food has a density; `each` if it has a weight per item).
# Each profile sits under the one before and inherits its stock, adding its own; a profile may also
# restate an item to change the amount.
#
# Curated by Claude, so every amount is `estimated`. The rule for an amount: half of a common US retail
# package, since what is on hand is anywhere between a full package and an empty one; a can or carton
# is kept whole, unopened. The items were chosen from what 33 HelloFresh recipes ask the cook to supply
# (salt, pepper, oil, butter, sugar, eggs, flour) and the staples they use most, then widened by kind of
# cooking. Instantiated stock is an assumption (`imputed`), not a count: a weighing replaces it.
# Tap water is left out: it is never bought or run out of.

[[profile]]
name = "Bare pantry"
note = "someone who rarely cooks: seasoning and a cooking oil"
stock = [
  { item = "Table salt", amount = 13, unit = "oz" },              # 26 oz canister
  { item = "Black pepper", amount = 1.5, unit = "oz" },           # 3 oz tin, ground
  { item = "Canola oil", amount = 24, unit = "fl_oz" },           # 48 fl oz bottle
  { item = "Olive oil", amount = 8.5, unit = "fl_oz" },           # 500 ml bottle
]

