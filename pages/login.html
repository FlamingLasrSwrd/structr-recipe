<h1>Sign in</h1>
<p id="insecure" class="problem" hidden></p>
<p id="unsaved" class="problem" hidden></p>
<form id="login">
  <label>Name <input name="name" autocomplete="username" required></label>
  <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit">Sign in</button>
  <p id="message" class="note"></p>
</form>
<script>
// Where to go once signed in: the page pages/signed-out.js sent the visitor from, and only ever one of
// the planner's own pages, with no query, so that no link can make signing in book or leave the site
function destination(search) {
  var given = /[?&]next=([^&]*)/.exec(search), path = "";
  try { path = given ? decodeURIComponent(given[1]) : ""; } catch (malformed) { path = ""; }
  return /^\/structr\/html\/(week|shopping|recipes|recipe|nutrition|pantry)(\/[A-Za-z0-9_%-]+)?$/.test(path)
    ? path : "/structr/html/week";
}
function tell(id, text) {
  var note = document.getElementById(id);
  note.textContent = text;
  note.hidden = false;
}
// Not at localhost and not over HTTPS: the browser drops Structr's Secure session cookie, so signing in
// here only leads back here (docs/pages.md, "HTTPS")
if (!window.isSecureContext) {
  tell("insecure", "Signing in does not last at this address, because it is not HTTPS. "
    + "Use the HTTPS address (usually https://" + location.hostname + ":8443/structr/html/login).");
}
if (/[?&]unsaved=1(&|$)/.test(location.search)) {
  tell("unsaved", "You were signed out, so your last change was not saved. Sign in, then make it again.");
}
// Structr's login takes JSON only, so the form posts it with fetch (structr-cheatsheet.md, Authentication)
document.getElementById("login").addEventListener("submit", function (event) {
  event.preventDefault();
  var form = event.target;
  fetch("/structr/rest/login", {method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({name: form.name.value, password: form.password.value})})
    .then(function (r) {
      if (r.ok) { window.location = destination(location.search); }
      else { document.getElementById("message").textContent = "That name and password did not sign in."; }
    });
});
</script>
