name: offline tests

# Runs the tests that need no Structr instance: the unit tests over the pure
# logic (including the planner and its brute-force oracle), the document-
# consistency checks, the schema-helper drift test, and a name check that
# stands in for pyflakes.
# The scripts that build and verify a live instance are not run here; see the
# README for the full-build check.

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m unittest discover -s tests -t . -v
      - run: python scripts/23a_schema_drift_test.py
      - run: python tools/check_names.py
