# Memory is capped on purpose. Left alone, Structr takes a 4 GB heap and Neo4j about a
# quarter of the machine plus a page cache, so one stack could grow to about 6.5 GB; on the
# 8 GB development laptop that, with the desktop app beside it, froze the machine
# (2026-09-27). This project's graph is a few thousand nodes. The limits below were checked
# against a full rebuild and a full vocabulary load (see the commit that set them).
services:
  neo4j:
    image: neo4j:2025.12.1
    mem_limit: 1g
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      - NEO4J_server_memory_pagecache_size=128m
    volumes:
      - neo4j-database:/data
      - neo4j-logs:/logs
    networks:
      structr-network:
        aliases: [neo4j]

  structr:
    image: structr/structr:6.0.0
    depends_on: [neo4j]
    mem_limit: 1536m
    ports:
      - "${STRUCTR_PORT:-8083}:8082"
    environment:
      - AGREE_TO_STRUCTR_PRIVACY_POLICY=yes
      - STRUCTR_application_heap_min__size=256m
      - STRUCTR_application_heap_max__size=1g
      - STRUCTR_superuser_password=${STRUCTR_SUPERUSER_PASSWORD}
      - STRUCTR_database_available_connections=neo4j_default
      - STRUCTR_neo4j__default_database_driver=org.structr.bolt.BoltDatabaseService
      - STRUCTR_neo4j__default_database_connection_url=bolt://neo4j:7687
      - STRUCTR_neo4j__default_database_connection_username=neo4j
      - STRUCTR_neo4j__default_database_connection_password=${NEO4J_PASSWORD}
      - STRUCTR_nodeservice_active=neo4j_default
      - STRUCTR_application_schema_automigration=true
    volumes:
      - structr-files:/var/lib/structr/files
      - structr-repository:/var/lib/structr/repository
      - structr-logs:/var/lib/structr/logs
      # Intentionally empty placeholder (Community edition needs no key); it only
      # exists so this bind mount has a file to attach to instead of Docker
      # creating a directory in its place.
      - ./structr/license.key:/var/lib/structr/license.key
    networks:
      structr-network: {}

volumes:
  neo4j-database:
  neo4j-logs:
  structr-files:
  structr-repository:
  structr-logs:

networks:
  structr-network: {}
