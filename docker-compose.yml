# Memory is capped on purpose. Left alone, Structr takes a 4 GB heap and Neo4j about a
# quarter of the machine plus a page cache, so one stack could grow to about 6.5 GB; on the
# 8 GB development laptop that, with the desktop app beside it, froze the machine
# (2026-09-27). The limits below were raised (the owner's decision, 2026-10-23) for a home
# book of about 1,000 recipes, some 110,000 nodes with the vocabulary: measured overnight on a
# throwaway stack of that size, Neo4j held 940-990 MiB of a 1 GiB cap and imports slowed from
# 8 s a recipe to 19, and Structr was OOM-killed at 1.5 GiB after six hours of imports. One
# stack now stays under 3.5 GiB; run one at a time.
services:
  neo4j:
    image: neo4j:2025.12.1
    mem_limit: 1536m
    # Docker's default 10 s killed Neo4j mid-shutdown ("Stopping..." and no "Stopped.", exit
    # 137, 2026-10-22): a database that must recover from its transaction log on the next start
    stop_grace_period: 2m
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_server_memory_heap_initial__size=256m
      - NEO4J_server_memory_heap_max__size=512m
      # Raised from 256m (the owner's request, 2026-10-24). Measured then: the owner's store was
      # 97 MB (41,455 nodes, 86,653 relationships), inside the old cache, and both heaps were
      # mostly free (Structr 170 MB of 1 GB, under a second of GC), so this does not speed today's
      # pages; it keeps the store cached as the book grows toward 1,000 recipes, about 2.5 times
      # the size. Neo4j fills the cache only as far as the store needs, within mem_limit.
      - NEO4J_server_memory_pagecache_size=512m
    volumes:
      - neo4j-database:/data
      - neo4j-logs:/logs
    networks:
      structr-network:
        aliases: [neo4j]

  structr:
    image: structr/structr:6.0.0
    depends_on: [neo4j]
    mem_limit: 2g
    # The image starts Java from a shell script without exec, so a stop signal reached only
    # the shell (PID 1, which ignores it) and Java was killed after the grace period. Docker's
    # init (tini) signals the whole process group instead, and Java's shutdown hook runs.
    init: true
    stop_grace_period: 2m
    ports:
      - "${STRUCTR_PORT:-8083}:8082"
    # Ready once Structr serves requests: 503 while it starts, stops or deploys, and no credentials
    # needed (docs/structr-features.md, the health spike). `docker compose ps` shows it;
    # tools/wait_for_structr.sh still makes an authenticated read, which also proves the password.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost:8082/structr/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 180s
    environment:
      - AGREE_TO_STRUCTR_PRIVACY_POLICY=yes
      - TINI_KILL_PROCESS_GROUP=1
      - STRUCTR_application_heap_min__size=256m
      - STRUCTR_application_heap_max__size=1g
      - STRUCTR_superuser_password=${STRUCTR_SUPERUSER_PASSWORD}
      - STRUCTR_database_available_connections=neo4j_default
      - STRUCTR_neo4j__default_database_driver=org.structr.bolt.BoltDatabaseService
      - STRUCTR_neo4j__default_database_connection_url=bolt://neo4j:7687
      - STRUCTR_neo4j__default_database_connection_username=neo4j
      - STRUCTR_neo4j__default_database_connection_password=${NEO4J_PASSWORD}
      - STRUCTR_nodeservice_active=neo4j_default
      - STRUCTR_application_schema_automigration=true
      # Who created and changed what, with the old and new values (docs/structr-features.md,
      # batch 1): kept as files in /var/lib/structr/changelog, hence the volume below, which
      # tools/backup.py backs up with the others. It records from when it was turned on.
      - STRUCTR_application_changelog_enabled=true
      - STRUCTR_application_changelog_user__centric_enabled=true
      # A write with a key the schema does not declare is refused (422), so a misspelt key, or a
      # tool run ahead of its migration, fails where it happens.
      - STRUCTR_jsonrestservlet_unknowninput_validation_mode=reject
    volumes:
      - structr-files:/var/lib/structr/files
      - structr-repository:/var/lib/structr/repository
      - structr-logs:/var/lib/structr/logs
      - structr-changelog:/var/lib/structr/changelog
      # Intentionally empty placeholder (Community edition needs no key); it only
      # exists so this bind mount has a file to attach to instead of Docker
      # creating a directory in its place.
      - ./structr/license.key:/var/lib/structr/license.key
    networks:
      structr-network: {}

volumes:
  neo4j-database:
  neo4j-logs:
  structr-files:
  structr-repository:
  structr-logs:
  structr-changelog:

networks:
  structr-network: {}
